<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Paros — Boato 1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f3ef; --surface: #ffffff; --border: #e0ddd5;
    --text: #1a1a18; --text-muted: #7a7870;
    --blue: #185FA5; --blue-light: #E6F1FB; --blue-dark: #0C447C;
    --green: #3B6D11; --green-light: #EAF3DE; --red: #A32D2D;
  }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; font-size:15px; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px 48px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; width:100%; max-width:540px; margin-bottom:14px; }
  .section-label { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px; }
  .cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .cat-btn { padding:12px 10px; border:1.5px solid var(--border); border-radius:8px; background:var(--bg); cursor:pointer; font-size:13px; color:var(--text); transition:all .15s; text-align:center; line-height:1.35; }
  .cat-btn:hover { border-color:var(--blue); background:var(--blue-light); color:var(--blue-dark); }
  .cat-btn.active { background:var(--blue-light); border-color:var(--blue); color:var(--blue-dark); font-weight:600; }
  .time-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .time-btn { padding:10px 6px; border:1.5px solid var(--border); border-radius:8px; background:var(--bg); cursor:pointer; font-size:12px; color:var(--text); transition:all .15s; text-align:center; line-height:1.4; }
  .time-btn:hover { border-color:var(--green); background:var(--green-light); color:var(--green); }
  .time-btn.active { background:var(--green-light); border-color:var(--green); color:var(--green); font-weight:600; }
  .add-btn { width:100%; max-width:540px; padding:14px; border:none; border-radius:10px; background:var(--blue); color:#fff; font-size:15px; font-weight:600; cursor:pointer; margin-bottom:14px; transition:opacity .15s,transform .1s; }
  .add-btn:disabled { opacity:.3; cursor:not-allowed; }
  .add-btn:not(:disabled):hover { opacity:.9; }
  .add-btn:not(:disabled):active { transform:scale(.98); }
  .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; width:100%; max-width:540px; }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 10px; text-align:center; }
  .stat-label { font-size:11px; color:var(--text-muted); margin-bottom:4px; }
  .stat-value { font-size:26px; font-weight:700; color:var(--text); }
  .log-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:540px; overflow:hidden; margin-bottom:14px; }
  .log-header { padding:14px 18px 10px; border-bottom:1px solid var(--border); font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); }
  .log-list { max-height:280px; overflow-y:auto; }
  .log-item { display:flex; align-items:center; gap:10px; padding:10px 18px; border-bottom:1px solid var(--border); font-size:13px; }
  .log-item:last-child { border-bottom:none; }
  .log-item:hover { background:var(--bg); }
  .log-cat { flex:1; color:var(--text); }
  .log-time,.log-hour { font-size:11px; color:var(--text-muted); white-space:nowrap; }
  .del-btn { background:none; border:none; cursor:pointer; color:var(--border); font-size:15px; padding:2px 4px; border-radius:4px; transition:color .15s; }
  .del-btn:hover { color:var(--red); }
  .empty-msg { text-align:center; padding:32px; color:var(--text-muted); font-size:13px; }
  .export-btn { width:100%; max-width:540px; padding:12px; border:1.5px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text); font-size:13px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .export-btn:hover { background:var(--bg); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px); background:#1a1a18; color:#fff; padding:10px 22px; border-radius:8px; font-size:13px; opacity:0; transition:all .25s; pointer-events:none; z-index:999; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- Topbar -->
<div style="width:100%;max-width:540px;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
  <div>
    <h1 style="font-size:20px;font-weight:600;letter-spacing:-0.3px;">Registro de Paros</h1>
    <p style="font-size:13px;color:var(--text-muted);margin-top:3px;">Boato 1</p>
  </div>
  <button onclick="showSupervisor()" style="padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;">Vista supervisor</button>
</div>

<div class="card">
  <p class="section-label">Categoría del paro</p>
  <div class="cat-grid" id="catGrid"></div>
</div>

<div class="card">
  <p class="section-label">Duración</p>
  <div class="time-grid" id="timeGrid"></div>
</div>

<button class="add-btn" id="addBtn" onclick="addStop()" disabled>+ Registrar paro</button>

<div class="stats-grid">
  <div class="stat-card"><p class="stat-label">Total paros</p><p class="stat-value" id="totalCount">0</p></div>
  <div class="stat-card"><p class="stat-label">Hoy</p><p class="stat-value" id="todayCount">0</p></div>
</div>

<div class="log-card">
  <div class="log-header">Paros registrados</div>
  <div class="log-list" id="logList"><div class="empty-msg">Sin paros registrados aún</div></div>
</div>

<button class="export-btn" onclick="exportExcel()">↓ &nbsp;Exportar a Excel</button>
<div class="toast" id="toast"></div>

<!-- VISTA SUPERVISOR -->
<div id="sv" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);overflow-y:auto;z-index:100;">
  <div style="background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;">
    <div>
      <div style="font-size:16px;font-weight:600;">Vista supervisor</div>
      <div style="font-size:12px;color:var(--text-muted);">Registros consolidados — Boato 1</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button onclick="loadSV()" style="padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;">Actualizar</button>
      <button onclick="exportSV()" style="padding:7px 14px;border-radius:6px;border:none;background:var(--green);color:#fff;font-size:13px;cursor:pointer;">Exportar Excel</button>
      <button onclick="hideSupervisor()" style="padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;">Volver</button>
    </div>
  </div>
  <div style="max-width:1000px;margin:0 auto;padding:20px 16px;">
    <!-- KPIs -->
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;">
      <div class="stat-card"><p class="stat-label">Total paros</p><p class="stat-value" style="color:var(--blue);" id="sv-total">-</p></div>
      <div class="stat-card"><p class="stat-label">Hoy</p><p class="stat-value" style="color:var(--green);" id="sv-hoy">-</p></div>
    </div>
    <!-- Resumen categorías -->
    <div id="sv-resumen" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:20px;"></div>
    <!-- Filtros -->
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <select id="sv-fmes" onchange="renderSV()" style="padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px;color:var(--text);">
        <option value="">Todos los meses</option>
        <option value="01">Enero</option><option value="02">Febrero</option><option value="03">Marzo</option>
        <option value="04">Abril</option><option value="05">Mayo</option><option value="06">Junio</option>
        <option value="07">Julio</option><option value="08">Agosto</option><option value="09">Septiembre</option>
        <option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option>
      </select>
      <input type="date" id="sv-ffecha" onchange="renderSV()" style="padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px;"/>
      <select id="sv-fcat" onchange="renderSV()" style="padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px;color:var(--text);">
        <option value="">Todas las categorías</option>
      </select>
      <select id="sv-fdur" onchange="renderSV()" style="padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px;color:var(--text);">
        <option value="">Todas las duraciones</option>
        <option value="Menos de 5 min">Menos de 5 min</option>
        <option value="Entre 5 y 10 min">Entre 5 y 10 min</option>
        <option value="Más de 10 min">Más de 10 min</option>
      </select>
    </div>
    <!-- Tabla -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;">
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="background:#1a2e4a;">
            <th style="color:#fff;font-size:12px;font-weight:500;padding:10px 12px;text-align:left;">Fecha</th>
            <th style="color:#fff;font-size:12px;font-weight:500;padding:10px 12px;text-align:left;">Hora</th>
            <th style="color:#fff;font-size:12px;font-weight:500;padding:10px 12px;text-align:left;">Categoría</th>
            <th style="color:#fff;font-size:12px;font-weight:500;padding:10px 12px;text-align:left;">Duración</th>
          </tr>
        </thead>
        <tbody id="sv-tbody"><tr><td colspan="4" class="empty-msg">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const CATEGORIES = ['Atasco sobre en tobogán','Atasco sobre en Wipotec','Interfaz por falta producto','Estuche de salida','Otros'];
  const TIMES = ['Menos de 5 min', 'Entre 5 y 10 min', 'Más de 10 min'];
  const STORAGE_KEY = 'paros_boato1_v1';
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxpEiyejk62kYrJlNhO2j9qlh1BqZw7hPRkDXokX0eueS8xAH0tfb2U0Y6Ja2rlJIxrGg/exec';
  const SHEET_NAME = 'Paros_Boato1';
  const SV_SHEET_ID = '166V7Tu-YEZ368aC1SaVqyjtP_PUII-fIMnexxEyqtQ0';

  var selectedCat = null, selectedTime = null, stops = [], svData = [];

  function saveData() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stops)); } catch(e) {} }
  function loadData() { try { var r=localStorage.getItem(STORAGE_KEY); if(r) stops=JSON.parse(r); } catch(e) { stops=[]; } }

  function saveToSheets(stop) {
    fetch(SCRIPT_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ sheet:SHEET_NAME, headers:['Fecha','Hora','Categoría','Duración'], rows:[[stop.date,stop.timestamp,stop.category,stop.time]] })
    }).catch(function(e){ console.warn('Error Sheets:',e); });
  }

  var catGrid = document.getElementById('catGrid');
  CATEGORIES.forEach(function(c) {
    var btn = document.createElement('button');
    btn.className='cat-btn'; btn.textContent=c;
    btn.onclick=function(){ selectCat(c,btn); };
    catGrid.appendChild(btn);
  });

  var timeGrid = document.getElementById('timeGrid');
  TIMES.forEach(function(t) {
    var btn = document.createElement('button');
    btn.className='time-btn'; btn.textContent=t;
    btn.onclick=function(){ selectTime(t,btn); };
    timeGrid.appendChild(btn);
  });

  loadData(); renderLog(); updateStats();

  function selectCat(c,btn) {
    selectedCat=c;
    document.querySelectorAll('.cat-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active'); checkReady();
  }
  function selectTime(t,btn) {
    selectedTime=t;
    document.querySelectorAll('.time-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active'); checkReady();
  }
  function checkReady() { document.getElementById('addBtn').disabled=!(selectedCat&&selectedTime); }
  function getNow() { return new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }
  function getDate() { return new Date().toLocaleDateString('es-AR'); }

  function addStop() {
    var stop={category:selectedCat,time:selectedTime,timestamp:getNow(),date:getDate()};
    stops.push(stop); saveData(); saveToSheets(stop); renderLog(); updateStats();
    showToast('Paro registrado ✓');
    selectedCat=null; selectedTime=null;
    document.querySelectorAll('.cat-btn,.time-btn').forEach(function(b){ b.classList.remove('active'); });
    checkReady();
  }

  function deleteStop(idx) {
    if(confirm('¿Eliminar este paro?')){ stops.splice(idx,1); saveData(); renderLog(); updateStats(); }
  }

  function renderLog() {
    var list=document.getElementById('logList');
    if(stops.length===0){ list.innerHTML='<div class="empty-msg">Sin paros registrados aún</div>'; return; }
    list.innerHTML=stops.slice().reverse().map(function(s,ri){
      var i=stops.length-1-ri;
      return '<div class="log-item"><span class="log-cat">'+s.category+'</span><span class="log-time">'+s.time+'</span><span class="log-hour">'+s.date+' '+s.timestamp+'</span><button class="del-btn" onclick="deleteStop('+i+')" title="Eliminar">✕</button></div>';
    }).join('');
  }

  function updateStats() {
    var today=getDate();
    document.getElementById('totalCount').textContent=stops.length;
    document.getElementById('todayCount').textContent=stops.filter(function(s){ return s.date===today; }).length;
  }

  function showToast(msg) {
    var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); },2000);
  }

  function exportExcel() {
    if(stops.length===0){ showToast('No hay paros para exportar'); return; }
    var rows=stops.map(function(s,i){ return {'N°':i+1,'Fecha':s.date,'Hora':s.timestamp,'Categoría':s.category,'Duración':s.time}; });
    var resumen={};
    CATEGORIES.forEach(function(c){ resumen[c]=0; });
    stops.forEach(function(s){ resumen[s.category]++; });
    var resumenRows=CATEGORIES.map(function(c){ return {'Categoría':c,'Cantidad':resumen[c]}; });
    var wb=XLSX.utils.book_new();
    var ws1=XLSX.utils.json_to_sheet(rows); ws1['!cols']=[{wch:4},{wch:12},{wch:8},{wch:28},{wch:14}];
    XLSX.utils.book_append_sheet(wb,ws1,'Registro de Paros');
    var ws2=XLSX.utils.json_to_sheet(resumenRows); ws2['!cols']=[{wch:28},{wch:10}];
    XLSX.utils.book_append_sheet(wb,ws2,'Resumen');
    var fecha=new Date().toLocaleDateString('es-AR').replace(/\//g,'-');
    XLSX.writeFile(wb,'paros_boato1_'+fecha+'.xlsx');
    showToast('Excel exportado ✓');
  }

  // ===== VISTA SUPERVISOR =====
  function showSupervisor() {
    document.getElementById('sv').style.display='block';
    document.body.style.overflow='hidden';
    if(svData.length===0) loadSV();
  }
  function hideSupervisor() {
    document.getElementById('sv').style.display='none';
    document.body.style.overflow='';
  }

  function loadSV() {
    document.getElementById('sv-tbody').innerHTML='<tr><td colspan="4" class="empty-msg">Cargando...</td></tr>';
    var url='https://script.google.com/macros/s/AKfycbxpEiyejk62kYrJlNhO2j9qlh1BqZw7hPRkDXokX0eueS8xAH0tfb2U0Y6Ja2rlJIxrGg/exec?action=get&sheet=Paros_Boato1&t='+Date.now();
    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(data){
        svData=[];
        var rows=data.rows||[];
        for(var i=0;i<rows.length;i++){
          var cols=rows[i];
          if(cols.length>=3&&cols[0]){
            var rawFecha=String(cols[0]);
            var fechaFmt=rawFecha;
            if(rawFecha.match(/^\d{4}-\d{2}-\d{2}/)){
              var dp=rawFecha.substring(0,10).split('-');
              fechaFmt=dp[2]+'/'+dp[1]+'/'+dp[0];
            }
            svData.push({fecha:fechaFmt,hora:String(cols[1]),categoria:String(cols[2]),duracion:String(cols[3]||'')});
          }
        }
        updateSVKPIs(); updateSVCats(); renderSV();
      })
      .catch(function(){
        document.getElementById('sv-tbody').innerHTML='<tr><td colspan="4" class="empty-msg" style="color:var(--red);">Error al cargar. Verificá la conexión.</td></tr>';
      });
  }

  function updateSVKPIs() {
    var today=new Date().toLocaleDateString('es-AR');
    document.getElementById('sv-total').textContent=svData.length;
    document.getElementById('sv-hoy').textContent=svData.filter(function(r){ return r.fecha===today; }).length;
  }

  function updateSVCats() {
    var cats={};
    svData.forEach(function(r){ if(r.categoria) cats[r.categoria]=1; });
    var sel=document.getElementById('sv-fcat');
    sel.innerHTML='<option value="">Todas las categorías</option>';
    Object.keys(cats).sort().forEach(function(c){
      var o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o);
    });
  }

  function getSVFiltered() {
    var mes=document.getElementById('sv-fmes').value;
    var fecha=document.getElementById('sv-ffecha').value;
    var cat=document.getElementById('sv-fcat').value;
    var dur=document.getElementById('sv-fdur').value;
    return svData.filter(function(r){
      if(mes){ var p=r.fecha.split('/'); if((p[1]||'').replace(/^0/,'')!==mes.replace(/^0/,'')) return false; }
      if(fecha){ var d=new Date(fecha); if(r.fecha!==d.toLocaleDateString('es-AR')) return false; }
      if(cat&&r.categoria!==cat) return false;
      if(dur&&r.duracion!==dur) return false;
      return true;
    });
  }

  function renderSV() {
    var rows=getSVFiltered();
    var catCount={};
    rows.forEach(function(r){ catCount[r.categoria]=(catCount[r.categoria]||0)+1; });
    var rg=document.getElementById('sv-resumen');
    rg.innerHTML=Object.keys(catCount).sort(function(a,b){ return catCount[b]-catCount[a]; }).map(function(c){
      return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;"><span style="font-size:13px;">'+c+'</span><span style="font-size:22px;font-weight:600;color:var(--blue);">'+catCount[c]+'</span></div>';
    }).join('');
    var tbody=document.getElementById('sv-tbody');
    if(rows.length===0){ tbody.innerHTML='<tr><td colspan="4" class="empty-msg">Sin registros para los filtros seleccionados</td></tr>'; return; }
    rows.sort(function(a,b){ return b.fecha.localeCompare(a.fecha)||b.hora.localeCompare(a.hora); });
    tbody.innerHTML=rows.map(function(r){
      return '<tr style="border-bottom:1px solid var(--border);"><td style="padding:10px 12px;font-size:13px;">'+r.fecha+'</td><td style="padding:10px 12px;font-size:13px;">'+r.hora+'</td><td style="padding:10px 12px;font-size:13px;">'+r.categoria+'</td><td style="padding:10px 12px;font-size:13px;">'+r.duracion+'</td></tr>';
    }).join('');
  }

  function exportSV() {
    var rows=getSVFiltered();
    if(rows.length===0){ showToast('No hay datos para exportar'); return; }
    var data=rows.map(function(r,i){ return {'N°':i+1,'Fecha':r.fecha,'Hora':r.hora,'Categoría':r.categoria,'Duración':r.duracion}; });
    var wb=XLSX.utils.book_new();
    var ws=XLSX.utils.json_to_sheet(data); ws['!cols']=[{wch:4},{wch:12},{wch:8},{wch:28},{wch:18}];
    XLSX.utils.book_append_sheet(wb,ws,'Paros Boato1');
    var fecha=new Date().toLocaleDateString('es-AR').replace(/\//g,'-');
    XLSX.writeFile(wb,'supervisor_boato1_'+fecha+'.xlsx');
    showToast('Excel exportado ✓');
  }
</script>
</body>
</html>
