<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Paros — Boato 1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f3ef;
    --surface: #ffffff;
    --border: #e0ddd5;
    --text: #1a1a18;
    --text-muted: #7a7870;
    --blue: #185FA5;
    --blue-light: #E6F1FB;
    --blue-dark: #0C447C;
    --green: #3B6D11;
    --green-light: #EAF3DE;
    --red: #A32D2D;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 15px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  header { width: 100%; max-width: 540px; margin-bottom: 24px; }
  header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
  header p { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 540px;
    margin-bottom: 14px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .cat-btn {
    padding: 12px 10px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    transition: all 0.15s;
    text-align: center;
    line-height: 1.35;
  }

  .cat-btn:hover { border-color: var(--blue); background: var(--blue-light); color: var(--blue-dark); }
  .cat-btn.active { background: var(--blue-light); border-color: var(--blue); color: var(--blue-dark); font-weight: 600; }

  .time-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .time-btn {
    padding: 10px 6px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    cursor: pointer;
    font-size: 12px;
    color: var(--text);
    transition: all 0.15s;
    text-align: center;
    line-height: 1.4;
  }

  .time-btn:hover { border-color: var(--green); background: var(--green-light); color: var(--green); }
  .time-btn.active { background: var(--green-light); border-color: var(--green); color: var(--green); font-weight: 600; }

  .add-btn {
    width: 100%;
    max-width: 540px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--blue);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 14px;
    transition: opacity 0.15s, transform 0.1s;
  }

  .add-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .add-btn:not(:disabled):hover { opacity: 0.9; }
  .add-btn:not(:disabled):active { transform: scale(0.98); }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 14px;
    width: 100%;
    max-width: 540px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
  }

  .stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .stat-value { font-size: 26px; font-weight: 700; color: var(--text); }

  .log-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 540px;
    overflow: hidden;
    margin-bottom: 14px;
  }

  .log-header {
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .log-list { max-height: 280px; overflow-y: auto; }

  .log-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    transition: background 0.1s;
  }

  .log-item:last-child { border-bottom: none; }
  .log-item:hover { background: var(--bg); }

  .log-cat { flex: 1; color: var(--text); }
  .log-time { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .log-hour { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

  .del-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--border);
    font-size: 15px;
    padding: 2px 4px;
    border-radius: 4px;
    transition: color 0.15s;
  }

  .del-btn:hover { color: var(--red); }

  .empty-msg {
    text-align: center;
    padding: 32px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .export-btn {
    width: 100%;
    max-width: 540px;
    padding: 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s;
  }

  .export-btn:hover { background: var(--bg); border-color: #bbb; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #1a1a18;
    color: #fff;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>Registro de Paros</h1>
  <p>Boato 1</p>
</header>

<div class="card">
  <p class="section-label">Categoría del paro</p>
  <div class="cat-grid" id="catGrid"></div>
</div>

<div class="card">
  <p class="section-label">Duración</p>
  <div class="time-grid" id="timeGrid"></div>
</div>

<button class="add-btn" id="addBtn" onclick="addStop()" disabled>+ Registrar paro</button>

<div class="stats-grid">
  <div class="stat-card"><p class="stat-label">Total paros</p><p class="stat-value" id="totalCount">0</p></div>
  <div class="stat-card"><p class="stat-label">Hoy</p><p class="stat-value" id="todayCount">0</p></div>
</div>

<div class="log-card">
  <div class="log-header">Paros registrados</div>
  <div class="log-list" id="logList">
    <div class="empty-msg">Sin paros registrados aún</div>
  </div>
</div>

<button class="export-btn" onclick="exportExcel()">↓ &nbsp;Exportar a Excel</button>

<div class="toast" id="toast"></div>

<script>
  const CATEGORIES = [
    'Atasco sobre en tobogán',
    'Atasco sobre en Wipotec',
    'Interfaz por falta producto',
    'Estuche de salida',
    'Otros'
  ];
  const TIMES = ['Menos de 5 min', 'Entre 5 y 10 min', 'Más de 10 min'];
  const STORAGE_KEY = 'paros_boato1_v1';
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1j39zIUHnEjjw6SBtb06IIHxhiipkEPvkho25qdBpnY1KWco39JGvuY9JSHoLu7c2RQ/exec';
  const SHEET_NAME = 'Paros_Boato1';

  let selectedCat = null;
  let selectedTime = null;
  let stops = [];

  function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stops)); } catch(e) {}
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) stops = JSON.parse(raw);
    } catch(e) { stops = []; }
  }

  // Render category buttons
  const catGrid = document.getElementById('catGrid');
  CATEGORIES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.textContent = c;
    btn.onclick = () => selectCat(c, btn);
    catGrid.appendChild(btn);
  });

  // Render time buttons
  const timeGrid = document.getElementById('timeGrid');
  TIMES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'time-btn';
    btn.textContent = t;
    btn.onclick = () => selectTime(t, btn);
    timeGrid.appendChild(btn);
  });


  async function saveToSheets(stop) {
    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sheet: SHEET_NAME,
          headers: ['Fecha', 'Hora', 'Categoría', 'Duración'],
          rows: [[stop.date, stop.timestamp, stop.category, stop.time]]
        })
      });
    } catch(e) { console.warn('Error Sheets:', e); }
  }

    loadData();
  renderLog();
  updateStats();

  function selectCat(c, btn) {
    selectedCat = c;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    checkReady();
  }

  function selectTime(t, btn) {
    selectedTime = t;
    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    checkReady();
  }

  function checkReady() {
    document.getElementById('addBtn').disabled = !(selectedCat && selectedTime);
  }

  function getNow() {
    return new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  }

  function getDate() {
    return new Date().toLocaleDateString('es-AR');
  }

  function addStop() {
    stops.push({
      category: selectedCat,
      time: selectedTime,
      timestamp: getNow(),
      date: getDate()
    });
    saveData();
    saveToSheets(stops[stops.length - 1]);
    renderLog();
    updateStats();
    showToast('Paro registrado ✓');

    selectedCat = null;
    selectedTime = null;
    document.querySelectorAll('.cat-btn, .time-btn').forEach(b => b.classList.remove('active'));
    checkReady();
  }

  function deleteStop(idx) {
    if (confirm('¿Eliminar este paro?')) {
      stops.splice(idx, 1);
      saveData();
      renderLog();
      updateStats();
    }
  }

  function renderLog() {
    const list = document.getElementById('logList');
    if (stops.length === 0) {
      list.innerHTML = '<div class="empty-msg">Sin paros registrados aún</div>';
      return;
    }
    list.innerHTML = stops.slice().reverse().map((s, ri) => {
      const i = stops.length - 1 - ri;
      return `<div class="log-item">
        <span class="log-cat">${s.category}</span>
        <span class="log-time">${s.time}</span>
        <span class="log-hour">${s.date} ${s.timestamp}</span>
        <button class="del-btn" onclick="deleteStop(${i})" title="Eliminar">✕</button>
      </div>`;
    }).join('');
  }

  function updateStats() {
    const today = getDate();
    document.getElementById('totalCount').textContent = stops.length;
    document.getElementById('todayCount').textContent = stops.filter(s => s.date === today).length;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function exportExcel() {
    if (stops.length === 0) { showToast('No hay paros para exportar'); return; }

    const rows = stops.map((s, i) => ({
      'N°': i + 1,
      'Fecha': s.date,
      'Hora': s.timestamp,
      'Categoría': s.category,
      'Duración': s.time
    }));

    const resumen = {};
    CATEGORIES.forEach(c => { resumen[c] = 0; });
    stops.forEach(s => { resumen[s.category]++; });
    const resumenRows = CATEGORIES.map(c => ({
      'Categoría': c,
      'Cantidad': resumen[c]
    }));

    const wb = XLSX.utils.book_new();

    const ws1 = XLSX.utils.json_to_sheet(rows);
    ws1['!cols'] = [{wch:4},{wch:12},{wch:8},{wch:28},{wch:14}];
    XLSX.utils.book_append_sheet(wb, ws1, 'Registro de Paros');

    const ws2 = XLSX.utils.json_to_sheet(resumenRows);
    ws2['!cols'] = [{wch:28},{wch:10}];
    XLSX.utils.book_append_sheet(wb, ws2, 'Resumen');

    const fecha = new Date().toLocaleDateString('es-AR').replace(/\//g,'-');
    XLSX.writeFile(wb, `paros_boato1_${fecha}.xlsx`);
    showToast('Excel exportado ✓');
  }
</script>
</body>
</html>
